[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "z-matrix-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "pyjwt[crypto]>=2.8",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "bcrypt>=4.1",
    # Pure-python magic-byte sniffing for upload validation (#226). No libmagic
    # system dependency — safer for the Railway/Nixpacks build than python-magic.
    "filetype>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "aiosqlite>=0.20",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["database*", "tests*", ".venv*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff.lint]
# Explicit rule set — do NOT inherit ruff's built-in defaults. Ruff expands its
# default selection between releases (0.16 folded UP045/UP017/I001/… into the
# defaults), which would flag 1100+ pre-existing *style* findings across the
# backend on a plain `ruff check` — no code change involved — and red every PR.
# Selecting rules explicitly freezes lint behaviour across ruff versions with
# zero code churn. This list is exactly what ruff 0.15.x enforced by default:
#   E4/E7/E9  pycodestyle errors (imports, statements, runtime/syntax)
#   F         pyflakes (undefined names, unused imports, f-strings, …)
#   C901      our cyclomatic-complexity gate (#223 1.2; ceiling set below)
# Adopting the newer stylistic families (pyupgrade/isort/bugbear/…) is a
# deliberate, separate PR that runs their autofixes — not a surprise from a
# version bump. Keep new/refactored functions at or under the C901 ceiling
# (the #240 god-function extractions are tracked separately).
select = ["E4", "E7", "E9", "F", "C901"]
# Phased docstring policy (#241). The Phase-1 gate enforces the *presence* of
# docstrings on public service symbols via a separate, explicitly-selected CI
# step, so it is independent of the `select` above:
#     ruff check app/services --select D101,D102,D103
# These ignores cover the module/package/__init__ docstring rules and the two
# mutually-exclusive multiline-summary rules, so a broader `--select D` (stylistic
# D2xx/D4xx) can be adopted in a later phase without churn.
extend-ignore = ["D100", "D104", "D107", "D203", "D213"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
# Tests don't need docstrings.
"tests/*" = ["D"]

